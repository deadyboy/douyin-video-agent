<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoMind · 收藏暗房</title>
<meta name="description" content="个人短视频知识库：刷到即收藏，AI 逐帧读屏后沉淀成的可检索笔记。">
<link rel="stylesheet" href="/static/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
</head>
<body data-view="feed">
<header class="masthead">
  <a class="brand" href="#feed" data-goto="feed">
    <span class="brand-mark"><span></span></span>
    <span class="brand-name">VideoMind</span>
    <span class="brand-sub">收藏暗房</span>
  </a>
  <button class="open-search" id="open-search">
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 12.5 L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>检索沉淀</span>
  </button>
</header>

<main id="main" tabindex="-1">
  <section class="outline" id="feed" data-view="feed">
    <h1 class="island-title">收藏</h1>
    <p class="island-note" id="feed-note">在暗房里逐帧显影</p>
  </section>

  <section class="detail hidden" id="detail" data-view="detail">
    <button class="back" id="back"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M12 4 L6 10 L12 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>回到收藏</button>
    <article id="detail-body"></article>
  </section>
</main>

<!-- 检索叠加层：全页暗房 -->
<div class="search-overlay" id="search-overlay" aria-hidden="true" hidden>
  <form class="search-form" id="search-form" role="search">
    <svg class="search-icon" viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.25" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.5 12.5 L16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <input id="search-q" type="search" placeholder="在想什么？一句话进去搜" autocomplete="off" spellcheck="false">
    <button class="close-search" id="close-search" type="button" aria-label="关闭检索">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5 L15 15 M15 5 L5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
  </form>
  <p class="search-hint" id="search-hint">中文子串即命中 · 逐字匹配沉淀的笔记</p>
  <div class="search-results" id="search-results" aria-live="polite"></div>
</div>

<noscript>
  <p style="padding:2rem;font-family:ui-monospace,monospace;color:#f6d676">此展示页需要 JavaScript 才能从 API 读取收藏。</p>
</noscript>

<script src="/static/app.js" defer></script>
</body>
</html>
